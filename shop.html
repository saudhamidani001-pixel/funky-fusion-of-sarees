<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Sarees · Funky Fusion Of Sarees</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="shop">
  <div class="page-title"><h1 id="shop-title">Shop All Sarees</h1><p id="count"></p></div>
  <section class="section" style="padding-top:36px">
    <div class="container">
      <div class="toolbar">
        <div class="filters" id="filters"></div>
        <select id="sort" aria-label="Sort">
          <option value="featured">Sort: Featured</option>
          <option value="low">Price: Low to high</option>
          <option value="high">Price: High to low</option>
        </select>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>
  <script src="assets/products.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
